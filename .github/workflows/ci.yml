name: Healthy Bites CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  prueba:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ejecutar pruebas JUnit
        run: mvn test

      - name: Generar JAR ejecutable
        run: mvn package

      - name: Guardar JAR como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: healthy-bites-jar
          path: target/*.jar
